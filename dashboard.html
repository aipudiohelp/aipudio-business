<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>لوحة التحكم — Aipudio Business</title>
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="dashboard.html">AIPUDIO <span>BUSINESS</span></a>
    <div class="top-actions"><span id="userEmail" class="muted"></span><button id="logoutBtn" class="btn btn-ghost">خروج</button></div>
  </header>
  <main class="container dashboard">
    <section class="dash-head"><div><p class="eyebrow">DASHBOARD</p><h1>لوحة التحكم</h1><p class="muted">إدارة نشاطك ومنتجاتك وصفحاتك.</p></div></section>
    <div id="status" class="message"></div>
    <section class="stats">
      <div class="stat card"><span>النشاط</span><strong id="businessCount">—</strong></div>
      <div class="stat card"><span>المنتجات</span><strong id="productCount">—</strong></div>
      <div class="stat card"><span>صفحات الهبوط</span><strong id="landingCount">—</strong></div>
    </section>
    <section class="quick-grid">
      <a href="business.html" class="card action-card"><b>إدارة النشاط</b><span>بيانات النشاط والصورة</span></a>
      <a href="business.html#products" class="card action-card"><b>المنتجات</b><span>إضافة وإدارة المنتجات</span></a>
      <a href="landing.html" class="card action-card"><b>صفحات الهبوط</b><span>إنشاء صفحة وعرضها</span></a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script src="js/dashboard.js"></script>
</body>
</html>
